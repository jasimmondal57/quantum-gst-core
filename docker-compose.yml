services:
  postgres:
    image: postgres:16-alpine
    container_name: quantum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-quantumgst}
      POSTGRES_USER: ${DB_USERNAME:-quantumgst_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantum_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-quantumgst}
      DB_USERNAME: ${DB_USERNAME:-quantumgst_user}
      DB_PASSWORD: ${DB_PASSWORD:-secretpassword}
    depends_on:
      - postgres
    volumes:
      - ./backend/storage:/var/www/html/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantum_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
